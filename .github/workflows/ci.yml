# Comprobaciones antes de mezclar en main. Un despliegue correcto de Vercel
# solo dice que compila; esto además pasa el lint y las pruebas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: clave-de-prueba

  # Reconstruye la base desde cero con todas las migraciones en un Postgres
  # vacío (con lo mínimo de Supabase simulado). Si alguien sube una
  # migración que rompe la secuencia, falla aquí y no el día que haga falta.
  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stub_supabase.sql
      - run: |
          for f in supabase/migrations/*.sql; do
            echo "▶ $f"
            psql -q -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/permisos_e_integridad.sql
